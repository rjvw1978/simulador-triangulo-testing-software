<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triángulo del Testing - Gestión y Estrategia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>El Triángulo del Testing</h1>
      <p>Ajusta las variables para analizar el equilibrio de tu estrategia de QA</p>
    </header>

    <div class="layout">
      <!-- Visualización Interactiva -->
      <main class="canvas-card">
        <canvas id="triangleCanvas" width="450" height="400"></canvas>
      </main>

      <!-- Panel de Control -->
      <aside class="controls-card">
        <h2>Variables de Gestión</h2>
        
        <div class="preset-buttons">
          <button class="btn" onclick="setPreset('balanced')">Balanceado</button>
          <button class="btn" onclick="setPreset('fast')">Lanzamiento Rápido</button>
          <button class="btn" onclick="setPreset('quality')">Alta Calidad</button>
          <button class="btn" onclick="setPreset('lowcost')">Bajo Presupuesto</button>
        </div>

        <hr />

        <div class="slider-group">
          <label for="coverage">
            <span>Cobertura / Alcance</span>
            <strong id="coverageVal">70%</strong>
          </label>
          <input type="range" id="coverage" min="10" max="100" value="70" />
        </div>

        <div class="slider-group">
          <label for="time">
            <span>Tiempo Disponible</span>
            <strong id="timeVal">50%</strong>
          </label>
          <input type="range" id="time" min="10" max="100" value="50" />
        </div>

        <div class="slider-group">
          <label for="cost">
            <span>Presupuesto / Recursos</span>
            <strong id="costVal">60%</strong>
          </label>
          <input type="range" id="cost" min="10" max="100" value="60" />
        </div>

        <div class="diagnosis" id="diagnosisBox">
          <h3>Diagnóstico de la Estrategia</h3>
          <p id="diagnosisText">Cargando análisis...</p>
        </div>
      </aside>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
